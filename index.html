<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級點數管理系統</title>
    <!-- 載入 Tailwind CSS 用於排版與樣式 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 React 核心庫 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 載入 Babel 讓瀏覽器能即時解析 JSX 語法 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
    <!-- React 應用程式的掛載點 -->
    <div id="root"></div>

    <!-- 將 React 程式碼寫在這裡，必須加上 type="text/babel" -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        // 請在這裡替換成您的 Google Apps Script Web App URL
        const GAS_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; 

        // 預設加分事由
        const DEFAULT_REASONS = [
            { id: 'r1', label: '上課專注', points: 1 },
            { id: 'r2', label: '主動發言', points: 2 },
            { id: 'r3', label: '作業完成', points: 1 },
            { id: 'r4', label: '幫助同學', points: 2 },
            { id: 'r5', label: '環境整潔', points: 1 },
            { id: 'r6', label: '秩序良好', points: 1 },
        ];

        // 記憶體模擬資料庫 (當尚未設定真實 GAS_URL 時使用)
        let mockDB = { students: [], logs: [] };

        // 登入畫面元件
        const LoginScreen = ({ onLogin }) => {
            const [classCode, setClassCode] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                if (classCode.trim()) onLogin(classCode.trim());
            };
            return (
                <div className="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
                    <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
                        <h1 className="text-3xl font-bold text-gray-800 mb-2">🎓 班級點數管理系統</h1>
                        <p className="text-gray-500 mb-8">請輸入您的專屬班級代碼以進入空間</p>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input
                                type="text"
                                placeholder="例如: 三年二班-王老師"
                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-lg"
                                value={classCode}
                                onChange={(e) => setClassCode(e.target.value)}
                                autoFocus
                            />
                            <button
                                type="submit"
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors text-lg"
                            >
                                進入班級
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // 主要管理系統元件
        function ClassPointSystem() {
            const [classId, setClassId] = useState('');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [isLoading, setIsLoading] = useState(false);
            const [syncStatus, setSyncStatus] = useState('idle');
            const [notification, setNotification] = useState(null);
            
            const [students, setStudents] = useState([]);
            const [logs, setLogs] = useState([]);
            const [totalClassPoints, setTotalClassPoints] = useState(0);
            
            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedStudentId, setSelectedStudentId] = useState('');
            const [selectedReason, setSelectedReason] = useState(null);
            
            // 學生管理狀態
            const [isStudentModalOpen, setIsStudentModalOpen] = useState(false);
            const [editingStudent, setEditingStudent] = useState(null);
            const [studentFormName, setStudentFormName] = useState('');
            const [batchStudentInput, setBatchStudentInput] = useState('');
            const [isBatchMode, setIsBatchMode] = useState(false);

            // 模擬 API 呼叫
            const callGasApi = async (action, payload = {}) => {
                if (GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
                    setSyncStatus('syncing');
                    return new Promise(resolve => {
                        setTimeout(() => {
                            let result = { success: false, message: 'Unknown action' };
                            const ts = new Date().toISOString();
                            try {
                                switch (action) {
                                    case 'getInitialData':
                                        result = { success: true, students: [...mockDB.students], logs: mockDB.logs.slice(0, 20) };
                                        break;
                                    case 'addStudent':
                                        const newId = 'mock-' + Date.now();
                                        mockDB.students.push({ id: newId, classId, name: payload.name, seatNumber: payload.seatNumber || '', points: 0, createdAt: ts });
                                        result = { success: true, id: newId };
                                        break;
                                    case 'batchAddStudents':
                                        payload.students.forEach((s, idx) => {
                                            mockDB.students.push({ id: 'mock-batch-' + Date.now() + '-' + idx, classId, name: s.name, seatNumber: s.seatNumber || '', points: 0, createdAt: ts });
                                        });
                                        result = { success: true };
                                        break;
                                    case 'deleteStudent':
                                        mockDB.students = mockDB.students.filter(s => s.id !== payload.id);
                                        result = { success: true };
                                        break;
                                    case 'updatePoints':
                                        const pStudent = mockDB.students.find(s => s.id === payload.studentId);
                                        if (pStudent) {
                                            pStudent.points = (pStudent.points || 0) + Number(payload.points);
                                            const logId = 'mock-log-' + Date.now();
                                            mockDB.logs.unshift({ id: logId, classId, studentId: payload.studentId, studentName: payload.studentName, points: payload.points, reason: payload.reason, timestamp: ts });
                                            result = { success: true, newPoints: pStudent.points, logId, timestamp: ts };
                                        }
                                        break;
                                    case 'clearLogs':
                                        mockDB.logs = [];
                                        result = { success: true };
                                        break;
                                }
                            } catch (e) {
                                result = { success: false, message: e.toString() };
                            }
                            setSyncStatus('idle');
                            resolve(result);
                        }, 400);
                    });
                } else {
                    // 真實 GAS 呼叫 (目前為簡化版，確保在純前端能跑)
                    setSyncStatus('syncing');
                    try {
                        const response = await fetch(GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action, classId, payload })
                        });
                        const result = await response.json();
                        setSyncStatus('idle');
                        return result;
                    } catch (error) {
                        setSyncStatus('error');
                        showNotification("網路連線錯誤或 CORS 問題，請確認 GAS 網址", true);
                        return null;
                    }
                }
            };

            const showNotification = (msg, isError = false) => {
                setNotification({ msg, isError });
                setTimeout(() => setNotification(null), 3000);
            };

            const fetchInitialData = async (cId) => {
                setIsLoading(true);
                const result = await callGasApi('getInitialData', { classId: cId });
                if (result) {
                    const sortedStudents = (result.students || []).sort((a, b) => {
                        const numA = parseInt(a.seatNumber);
                        const numB = parseInt(b.seatNumber);
                        if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                        return a.name.localeCompare(b.name);
                    });
                    setStudents(sortedStudents);
                    setLogs(result.logs || []);
                    const total = sortedStudents.reduce((sum, s) => sum + (Number(s.points) || 0), 0);
                    setTotalClassPoints(total);
                }
                setIsLoading(false);
            };

            const handleLogin = (code) => {
                setClassId(code);
                setIsLoggedIn(true);
                fetchInitialData(code);
            };

            const handleLogout = () => {
                setClassId('');
                setIsLoggedIn(false);
                setStudents([]);
                setLogs([]);
            };

            const handleAddPoints = async (pointsToAdd) => {
                if (!selectedStudentId) {
                    showNotification("請先選擇學生！", true);
                    return;
                }
                const student = students.find(s => s.id === selectedStudentId);
                if (!student) return;
                
                const reasonText = selectedReason ? selectedReason.label : "一般加分";
                
                // 先更新前端 UI (樂觀更新)
                const finalPoints = Number(pointsToAdd);
                setStudents(prev => prev.map(s => s.id === student.id ? { ...s, points: (s.points || 0) + finalPoints } : s));
                setTotalClassPoints(prev => prev + finalPoints);
                
                const tempLog = {
                    id: 'temp-' + Date.now(),
                    studentId: student.id,
                    studentName: student.name,
                    points: finalPoints,
                    reason: reasonText,
                    timestamp: new Date().toISOString()
                };
                setLogs(prev => [tempLog, ...prev].slice(0, 20));
                setSelectedReason(null);

                // 背景同步至後端
                const result = await callGasApi('updatePoints', {
                    studentId: student.id,
                    studentName: student.name,
                    points: finalPoints,
                    reason: reasonText
                });
                
                if (!result || !result.success) {
                    showNotification("資料同步失敗，將重新整理", true);
                    fetchInitialData(classId); // 失敗則還原
                }
            };

            const handleSaveStudent = async () => {
                if (isBatchMode) {
                    const names = batchStudentInput.split('\n').map(n => n.trim()).filter(n => n !== "");
                    if (names.length === 0) return;
                    
                    const newStudentsData = [];
                    for (let i = 0; i < names.length; i++) {
                        let name = names[i];
                        let seatNumber = `${i + 1 + students.length}`;
                        const match = name.match(/^(\d+)[\s.-]+(.*)$/);
                        if (match) {
                            seatNumber = match[1];
                            name = match[2];
                        }
                        newStudentsData.push({ name, seatNumber });
                    }
                    
                    setIsStudentModalOpen(false);
                    const result = await callGasApi('batchAddStudents', { students: newStudentsData });
                    if (result && result.success) {
                        showNotification(`成功批次新增 ${newStudentsData.length} 名學生`);
                        fetchInitialData(classId);
                    } else {
                        showNotification("批次新增失敗", true);
                    }
                } else {
                    if (!studentFormName.trim()) return;
                    setIsStudentModalOpen(false);
                    
                    const result = await callGasApi('addStudent', {
                        name: studentFormName,
                        seatNumber: `${students.length + 1}`
                    });
                    
                    if (result && result.success) {
                        showNotification(`成功新增學生：${studentFormName}`);
                        fetchInitialData(classId);
                    } else {
                        showNotification("新增學生失敗", true);
                    }
                }
            };

            const handleDeleteStudent = async (id, name) => {
                if (window.confirm(`確定要刪除學生「${name}」嗎？此操作無法還原。`)) {
                    const result = await callGasApi('deleteStudent', { id });
                    if (result && result.success) {
                        showNotification(`已刪除學生：${name}`);
                        fetchInitialData(classId);
                    }
                }
            };

            const handleClearLogs = async () => {
                if (window.confirm('確定要清空所有紀錄嗎？')) {
                    const result = await callGasApi('clearLogs');
                    if (result && result.success) {
                        setLogs([]);
                        showNotification('紀錄已清空');
                    }
                }
            };

            if (!isLoggedIn) {
                return <LoginScreen onLogin={handleLogin} />;
            }

            return (
                <div className="max-w-6xl mx-auto p-4 font-sans text-gray-800">
                    {/* 頂部導覽列 */}
                    <div className="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-6">
                        <div className="flex items-center gap-3 mb-4 sm:mb-0">
                            <span className="text-3xl">🌱</span>
                            <div>
                                <h1 className="text-2xl font-bold text-gray-800">班級點數 ({classId})</h1>
                                <p className="text-sm text-gray-500">一起努力，創造更棒的班級！</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="bg-blue-50 px-4 py-2 rounded-lg border border-blue-100 flex items-center gap-2">
                                <span className="text-xl">🏆</span>
                                <div>
                                    <div className="text-xs text-blue-600 font-semibold">班級總點數</div>
                                    <div className="text-xl font-bold text-blue-700">{totalClassPoints}</div>
                                </div>
                            </div>
                            <button onClick={handleLogout} className="px-3 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">
                                登出🚪
                            </button>
                        </div>
                    </div>

                    {/* 提示訊息 */}
                    {notification && (
                        <div className={`fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white font-medium z-50 transition-all ${notification.isError ? 'bg-red-500' : 'bg-green-500'}`}>
                            {notification.msg}
                        </div>
                    )}

                    {/* 頁籤切換 */}
                    <div className="flex gap-2 mb-6 bg-white p-1 rounded-lg w-fit shadow-sm">
                        <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-md font-medium transition-colors ${activeTab === 'dashboard' ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-50'}`}>主控台</button>
                        <button onClick={() => setActiveTab('students')} className={`px-4 py-2 rounded-md font-medium transition-colors ${activeTab === 'students' ? 'bg-blue-100 text-blue-700' : 'text-gray-500 hover:bg-gray-50'}`}>學生管理</button>
                    </div>

                    {/* 主控台頁面 */}
                    {activeTab === 'dashboard' && (
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* 左側功能區 */}
                            <div className="lg:col-span-2 space-y-6">
                                {/* 快速加分區 */}
                                <div className="bg-teal-50 border border-teal-100 rounded-2xl p-6 shadow-sm">
                                    <h2 className="text-lg font-bold text-teal-800 mb-4 flex items-center gap-2">
                                        ⚡ 快速加分
                                    </h2>
                                    
                                    <div className="space-y-5">
                                        <div>
                                            <label className="block text-sm font-medium text-teal-700 mb-2">1. 選擇學生：</label>
                                            <select 
                                                className="w-full p-3 rounded-lg border border-teal-200 focus:ring-2 focus:ring-teal-400 outline-none bg-white text-lg"
                                                value={selectedStudentId}
                                                onChange={(e) => setSelectedStudentId(e.target.value)}
                                            >
                                                <option value="">-- 請選擇學生 --</option>
                                                {students.map(s => (
                                                    <option key={s.id} value={s.id}>
                                                        {s.seatNumber ? `${s.seatNumber}號 - ` : ''}{s.name} (目前 {s.points || 0} 點)
                                                    </option>
                                                ))}
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-teal-700 mb-2">2. 選擇事由 (選填)：</label>
                                            <div className="flex flex-wrap gap-2">
                                                {DEFAULT_REASONS.map(reason => (
                                                    <button
                                                        key={reason.id}
                                                        onClick={() => setSelectedReason(reason === selectedReason ? null : reason)}
                                                        className={`px-3 py-1.5 rounded-full text-sm font-medium border transition-colors ${
                                                            selectedReason?.id === reason.id 
                                                            ? 'bg-teal-600 text-white border-teal-600' 
                                                            : 'bg-white text-teal-700 border-teal-200 hover:bg-teal-100'
                                                        }`}
                                                    >
                                                        {reason.label} (+{reason.points})
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-teal-700 mb-2">3. 給予點數：</label>
                                            <div className="grid grid-cols-3 gap-3">
                                                {[1, 2, 5].map(pts => (
                                                    <button
                                                        key={pts}
                                                        onClick={() => handleAddPoints(pts)}
                                                        className="bg-teal-500 hover:bg-teal-600 text-white font-bold py-4 rounded-xl text-xl shadow-sm transition-transform active:scale-95"
                                                    >
                                                        +{pts}
                                                    </button>
                                                ))}
                                                <button
                                                    onClick={() => handleAddPoints(-1)}
                                                    className="bg-red-400 hover:bg-red-500 text-white font-bold py-4 rounded-xl text-xl shadow-sm transition-transform active:scale-95 col-span-3 mt-2"
                                                >
                                                    -1 (扣分)
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* 學生列表網格 */}
                                <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                                    <h2 className="text-lg font-bold text-gray-800 mb-4">學生點數一覽</h2>
                                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                                        {students.map(s => (
                                            <div key={s.id} onClick={() => setSelectedStudentId(s.id)} className={`p-4 rounded-xl border cursor-pointer transition-all ${selectedStudentId === s.id ? 'border-blue-500 bg-blue-50 shadow-md ring-2 ring-blue-200' : 'border-gray-200 hover:border-blue-300 hover:bg-gray-50'}`}>
                                                <div className="text-xs text-gray-400 font-medium mb-1">{s.seatNumber}號</div>
                                                <div className="font-bold text-gray-800 truncate">{s.name}</div>
                                                <div className="mt-2 text-xl font-black text-blue-600">{s.points || 0}</div>
                                            </div>
                                        ))}
                                        {students.length === 0 && (
                                            <div className="col-span-full py-8 text-center text-gray-400">
                                                尚未新增任何學生，請前往「學生管理」新增。
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* 右側紀錄區 */}
                            <div>
                                <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 h-full max-h-[800px] flex flex-col">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                                            🕒 最近紀錄
                                        </h2>
                                        {logs.length > 0 && (
                                            <button onClick={handleClearLogs} className="text-xs text-gray-400 hover:text-red-500 px-2 py-1">
                                                清空
                                            </button>
                                        )}
                                    </div>
                                    <div className="flex-1 overflow-y-auto space-y-3 pr-2">
                                        {logs.length === 0 ? (
                                            <div className="text-center text-gray-400 py-10 text-sm">暫無異動紀錄</div>
                                        ) : (
                                            logs.map(log => (
                                                <div key={log.id} className="p-3 bg-gray-50 rounded-lg border border-gray-100 text-sm flex justify-between items-start">
                                                    <div>
                                                        <div className="font-bold text-gray-700">{log.studentName}</div>
                                                        <div className="text-gray-500 text-xs mt-1">{log.reason}</div>
                                                    </div>
                                                    <div className="text-right">
                                                        <div className={`font-bold ${log.points > 0 ? 'text-green-600' : 'text-red-500'}`}>
                                                            {log.points > 0 ? '+' : ''}{log.points}
                                                        </div>
                                                        <div className="text-[10px] text-gray-400 mt-1">
                                                            {new Date(log.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 學生管理頁面 */}
                    {activeTab === 'students' && (
                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                            <div className="flex justify-between items-center mb-6">
                                <h2 className="text-xl font-bold text-gray-800">班級學生名單</h2>
                                <button 
                                    onClick={() => {
                                        setStudentFormName('');
                                        setBatchStudentInput('');
                                        setIsBatchMode(false);
                                        setIsStudentModalOpen(true);
                                    }}
                                    className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2"
                                >
                                    ➕ 新增學生
                                </button>
                            </div>
                            
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-gray-50 text-gray-500 border-b border-gray-200">
                                            <th className="p-4 font-medium rounded-tl-lg">座號</th>
                                            <th className="p-4 font-medium">姓名</th>
                                            <th className="p-4 font-medium">目前點數</th>
                                            <th className="p-4 font-medium text-right rounded-tr-lg">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {students.length === 0 ? (
                                            <tr><td colSpan="4" className="p-8 text-center text-gray-400">目前沒有學生資料</td></tr>
                                        ) : (
                                            students.map((s, index) => (
                                                <tr key={s.id} className="border-b border-gray-100 hover:bg-gray-50">
                                                    <td className="p-4 text-gray-600">{s.seatNumber || index + 1}</td>
                                                    <td className="p-4 font-medium text-gray-800">{s.name}</td>
                                                    <td className="p-4">
                                                        <span className="bg-blue-100 text-blue-800 py-1 px-3 rounded-full text-sm font-bold">
                                                            {s.points || 0} 點
                                                        </span>
                                                    </td>
                                                    <td className="p-4 text-right">
                                                        <button 
                                                            onClick={() => handleDeleteStudent(s.id, s.name)}
                                                            className="text-red-500 hover:bg-red-50 p-2 rounded-md transition-colors"
                                                            title="刪除學生"
                                                        >
                                                            🗑️ 刪除
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {/* 新增學生彈跳視窗 */}
                    {isStudentModalOpen && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
                                <h3 className="text-lg font-bold mb-4">新增學生</h3>
                                
                                <div className="flex gap-2 mb-4 bg-gray-100 p-1 rounded-lg">
                                    <button onClick={() => setIsBatchMode(false)} className={`flex-1 py-2 text-sm font-medium rounded-md ${!isBatchMode ? 'bg-white shadow' : 'text-gray-500'}`}>單筆新增</button>
                                    <button onClick={() => setIsBatchMode(true)} className={`flex-1 py-2 text-sm font-medium rounded-md ${isBatchMode ? 'bg-white shadow' : 'text-gray-500'}`}>批次新增</button>
                                </div>

                                {!isBatchMode ? (
                                    <div className="mb-6">
                                        <label className="block text-sm font-medium text-gray-700 mb-1">學生姓名</label>
                                        <input 
                                            type="text" 
                                            className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={studentFormName}
                                            onChange={(e) => setStudentFormName(e.target.value)}
                                            placeholder="請輸入姓名"
                                            autoFocus
                                        />
                                    </div>
                                ) : (
                                    <div className="mb-6">
                                        <label className="block text-sm font-medium text-gray-700 mb-1">批次貼上名單 (每行一位)</label>
                                        <textarea 
                                            className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none h-32"
                                            value={batchStudentInput}
                                            onChange={(e) => setBatchStudentInput(e.target.value)}
                                            placeholder="王小明&#10;1 葉大雄&#10;2 宜靜"
                                        />
                                        <p className="text-xs text-gray-500 mt-2">支援直接貼上 Excel 欄位，可包含座號。</p>
                                    </div>
                                )}

                                <div className="flex justify-end gap-2">
                                    <button onClick={() => setIsStudentModalOpen(false)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg font-medium">取消</button>
                                    <button onClick={handleSaveStudent} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium">儲存</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // 渲染 App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ClassPointSystem />);
    </script>
</body>
</html>

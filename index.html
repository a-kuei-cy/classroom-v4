<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級點數管理系統 (含管理者後台)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 請替換為您的 Google Apps Script 網址
        const GAS_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL"; 

        const DEFAULT_REASONS = [
            { id: 'r1', label: '上課專注', points: 1 },
            { id: 'r2', label: '主動發言', points: 2 },
            { id: 'r3', label: '作業完成', points: 1 },
            { id: 'r4', label: '幫助同學', points: 2 },
            { id: 'r5', label: '環境整潔', points: 1 },
            { id: 'r6', label: '秩序良好', points: 1 },
        ];

        // 本地模擬資料庫
        let mockDB = {
            students: [
                { id: 'm1', classId: '三年二班-王老師', name: '張小明', seatNumber: '1', points: 12 },
                { id: 'm2', classId: '三年二班-王老師', name: '李小華', seatNumber: '2', points: 8 },
                { id: 'm3', classId: '四年一班-陳老師', name: '林大同', seatNumber: '1', points: 25 },
            ],
            logs: [
                { id: 'l1', classId: '三年二班-王老師', studentName: '張小明', points: 2, reason: '主動發言', timestamp: new Date().toISOString() }
            ]
        };

        // 登入與管理者彈窗元件
        const LoginScreen = ({ onLogin, onAdminLogin }) => {
            const [classCode, setClassCode] = useState('');
            const [isAdminModalOpen, setIsAdminModalOpen] = useState(false);
            const [adminPass, setAdminPass] = useState('');
            const [adminError, setAdminError] = useState('');
            const [isVerifying, setIsVerifying] = useState(false);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (classCode.trim()) onLogin(classCode.trim());
            };

            const handleAdminSubmit = async (e) => {
                e.preventDefault();
                if (!adminPass.trim()) return;
                setAdminError('');
                setIsVerifying(true);
                const success = await onAdminLogin(adminPass.trim());
                setIsVerifying(false);
                if (!success) {
                    setAdminError('密碼驗證失敗或連線異常，請確認後再試！');
                }
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
                        <h1 className="text-3xl font-bold text-gray-800 mb-2">🎓 班級點數管理系統</h1>
                        <p className="text-gray-500 mb-8">請輸入您的專屬班級代碼以進入空間</p>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <input
                                type="text"
                                placeholder="例如: 三年二班-王老師"
                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-lg"
                                value={classCode}
                                onChange={(e) => setClassCode(e.target.value)}
                                autoFocus
                            />
                            <button
                                type="submit"
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-colors text-lg"
                            >
                                進入班級
                            </button>
                        </form>

                        <div className="mt-8 pt-4 border-t border-gray-100 text-right">
                            <button 
                                onClick={() => { setIsAdminModalOpen(true); setAdminError(''); }}
                                className="text-xs text-indigo-600 hover:underline flex items-center gap-1 justify-end ml-auto"
                            >
                                🔑 全校/全局管理者登入
                            </button>
                        </div>
                    </div>

                    {/* 管理者登入彈窗 */}
                    {isAdminModalOpen && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl text-left">
                                <h3 className="text-lg font-bold text-gray-800 mb-2">🔑 管理者身分驗證</h3>
                                <p className="text-xs text-gray-500 mb-4">輸入全局管理者密碼以調閱所有班級資料。</p>
                                
                                {adminError && (
                                    <div className="mb-4 p-2.5 bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg font-medium">
                                        ⚠️ {adminError}
                                    </div>
                                )}

                                <form onSubmit={handleAdminSubmit} className="space-y-4">
                                    <input 
                                        type="password"
                                        placeholder="請輸入管理者密碼"
                                        className="w-full p-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 text-sm"
                                        value={adminPass}
                                        onChange={(e) => setAdminPass(e.target.value)}
                                        autoFocus
                                    />
                                    <div className="flex justify-end gap-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setIsAdminModalOpen(false)}
                                            className="px-4 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg"
                                            disabled={isVerifying}
                                        >
                                            取消
                                        </button>
                                        <button 
                                            type="submit"
                                            disabled={isVerifying}
                                            className="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg disabled:opacity-50"
                                        >
                                            {isVerifying ? '驗證中...' : '進入管理後台'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 管理者後台 UI 元件
        const AdminDashboard = ({ adminKey, onExit, onSelectClass, callGasApi, showNotification }) => {
            const [classList, setClassList] = useState([]);
            const [loading, setLoading] = useState(true);

            const fetchClasses = async () => {
                setLoading(true);
                const res = await callGasApi('adminGetAllClasses', {}, adminKey);
                if (res && res.success) {
                    setClassList(res.classes || []);
                } else {
                    showNotification(res?.message || "無法載入班級列表", true);
                }
                setLoading(false);
            };

            useEffect(() => {
                fetchClasses();
            }, []);

            const handleDeleteClass = async (targetClassId) => {
                if (window.confirm(`⚠️ 警告：確定要清空並刪除「${targetClassId}」的所有學生與紀錄嗎？`)) {
                    const res = await callGasApi('adminDeleteClass', { targetClassId }, adminKey);
                    if (res && res.success) {
                        showNotification(`已刪除班級：${targetClassId}`);
                        fetchClasses();
                    }
                }
            };

            const totalStudents = classList.reduce((sum, c) => sum + c.studentCount, 0);
            const totalPoints = classList.reduce((sum, c) => sum + c.totalPoints, 0);

            return (
                <div className="max-w-6xl mx-auto p-4 font-sans">
                    <div className="flex flex-col sm:flex-row justify-between items-center bg-indigo-900 text-white p-6 rounded-2xl shadow-md mb-6">
                        <div>
                            <span className="text-xs bg-indigo-700 px-2.5 py-1 rounded-full font-mono text-indigo-200">System Admin Control</span>
                            <h1 className="text-2xl font-bold mt-2">🛡️ 全校班級線上後台</h1>
                        </div>
                        <button 
                            onClick={onExit}
                            className="mt-4 sm:mt-0 bg-indigo-700 hover:bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors"
                        >
                            退出管理者模式 🚪
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                            <div className="text-gray-500 text-sm">使用中的班級總數</div>
                            <div className="text-3xl font-extrabold text-indigo-600 mt-1">{classList.length} 個班級</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                            <div className="text-gray-500 text-sm">全校學生總數</div>
                            <div className="text-3xl font-extrabold text-blue-600 mt-1">{totalStudents} 人</div>
                        </div>
                        <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                            <div className="text-gray-500 text-sm">系統發放點數總額</div>
                            <div className="text-3xl font-extrabold text-teal-600 mt-1">{totalPoints} 點</div>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-200">
                        <div className="flex justify-between items-center mb-4">
                            <h2 className="text-lg font-bold text-gray-800">全校班級管理與監控</h2>
                            <button onClick={fetchClasses} className="text-sm text-indigo-600 hover:underline">重新整理數據</button>
                        </div>

                        {loading ? (
                            <div className="text-center py-12 text-gray-400">載入班級數據中...</div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-gray-50 text-gray-500 border-b">
                                            <th className="p-4 font-medium">班級代碼 / 名稱</th>
                                            <th className="p-4 font-medium">學生人數</th>
                                            <th className="p-4 font-medium">班級累積總點數</th>
                                            <th className="p-4 font-medium text-right">管理操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {classList.length === 0 ? (
                                            <tr><td colSpan="4" className="p-8 text-center text-gray-400">目前尚無任何班級資料</td></tr>
                                        ) : (
                                            classList.map(c => (
                                                <tr key={c.classId} className="border-b hover:bg-gray-50">
                                                    <td className="p-4 font-bold text-gray-800">{c.classId}</td>
                                                    <td className="p-4 text-gray-600">{c.studentCount} 人</td>
                                                    <td className="p-4 font-semibold text-indigo-600">{c.totalPoints} 點</td>
                                                    <td className="p-4 text-right space-x-2">
                                                        <button 
                                                            onClick={() => onSelectClass(c.classId)}
                                                            className="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-md text-xs font-medium"
                                                        >
                                                            👁️ 切換至該班視角
                                                        </button>
                                                        <button 
                                                            onClick={() => handleDeleteClass(c.classId)}
                                                            className="bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-md text-xs font-medium"
                                                        >
                                                            🗑️ 刪除班級
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 主要應用程式元件
        function ClassPointSystem() {
            const [classId, setClassId] = useState('');
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [adminKey, setAdminKey] = useState('');
            
            const [isLoading, setIsLoading] = useState(false);
            const [notification, setNotification] = useState(null);
            
            const [students, setStudents] = useState([]);
            const [logs, setLogs] = useState([]);
            const [totalClassPoints, setTotalClassPoints] = useState(0);
            
            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedStudentId, setSelectedStudentId] = useState('');
            const [selectedReason, setSelectedReason] = useState(null);
            
            const [isStudentModalOpen, setIsStudentModalOpen] = useState(false);
            const [studentFormName, setStudentFormName] = useState('');
            const [batchStudentInput, setBatchStudentInput] = useState('');
            const [isBatchMode, setIsBatchMode] = useState(false);

            const showNotification = (msg, isError = false) => {
                setNotification({ msg, isError });
                setTimeout(() => setNotification(null), 3000);
            };

            const callGasApi = async (action, payload = {}, authAdminKey = null) => {
                if (GAS_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
                    return new Promise(resolve => {
                        setTimeout(() => {
                            let result = { success: false };
                            const ts = new Date().toISOString();
                            
                            if (action.startsWith('admin')) {
                                if (authAdminKey !== 'admin888') {
                                    resolve({ success: false, message: '管理者密碼錯誤 (預設密碼: admin888)' });
                                    return;
                                }
                                if (action === 'adminVerify') result = { success: true };
                                if (action === 'adminGetAllClasses') {
                                    const map = {};
                                    mockDB.students.forEach(s => {
                                        if (!map[s.classId]) map[s.classId] = { classId: s.classId, studentCount: 0, totalPoints: 0 };
                                        map[s.classId].studentCount += 1;
                                        map[s.classId].totalPoints += (s.points || 0);
                                    });
                                    result = { success: true, classes: Object.values(map) };
                                }
                                if (action === 'adminDeleteClass') {
                                    mockDB.students = mockDB.students.filter(s => s.classId !== payload.targetClassId);
                                    mockDB.logs = mockDB.logs.filter(l => l.classId !== payload.targetClassId);
                                    result = { success: true };
                                }
                                resolve(result);
                                return;
                            }

                            switch (action) {
                                case 'getInitialData':
                                    const cStudents = mockDB.students.filter(s => s.classId === classId);
                                    const cLogs = mockDB.logs.filter(l => l.classId === classId);
                                    result = { success: true, students: cStudents, logs: cLogs };
                                    break;
                                case 'addStudent':
                                    const newId = 'm_' + Date.now();
                                    mockDB.students.push({ id: newId, classId, name: payload.name, seatNumber: payload.seatNumber || '', points: 0 });
                                    result = { success: true, id: newId };
                                    break;
                                case 'batchAddStudents':
                                    payload.students.forEach((s, idx) => {
                                        mockDB.students.push({ id: 'm_b_' + Date.now() + '_' + idx, classId, name: s.name, seatNumber: s.seatNumber || '', points: 0 });
                                    });
                                    result = { success: true };
                                    break;
                                case 'deleteStudent':
                                    mockDB.students = mockDB.students.filter(s => s.id !== payload.id);
                                    result = { success: true };
                                    break;
                                case 'updatePoints':
                                    const st = mockDB.students.find(s => s.id === payload.studentId);
                                    if (st) {
                                        st.points = (st.points || 0) + Number(payload.points);
                                        mockDB.logs.unshift({ id: 'l_' + Date.now(), classId, studentName: payload.studentName, points: payload.points, reason: payload.reason, timestamp: ts });
                                        result = { success: true, newPoints: st.points };
                                    }
                                    break;
                                case 'clearLogs':
                                    mockDB.logs = mockDB.logs.filter(l => l.classId !== classId);
                                    result = { success: true };
                                    break;
                            }
                            resolve(result);
                        }, 300);
                    });
                } else {
                    try {
                        const response = await fetch(GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action, classId, payload, adminKey: authAdminKey })
                        });
                        return await response.json();
                    } catch (error) {
                        showNotification("連線失敗，請檢查網路或 GAS 發布權限", true);
                        return null;
                    }
                }
            };

            const fetchInitialData = async (cId) => {
                setIsLoading(true);
                const result = await callGasApi('getInitialData', {}, null);
                if (result && result.success) {
                    const sortedStudents = (result.students || []).sort((a, b) => {
                        const numA = parseInt(a.seatNumber);
                        const numB = parseInt(b.seatNumber);
                        if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
                        return a.name.localeCompare(b.name);
                    });
                    setStudents(sortedStudents);
                    setLogs(result.logs || []);
                    setTotalClassPoints(sortedStudents.reduce((sum, s) => sum + (Number(s.points) || 0), 0));
                }
                setIsLoading(false);
            };

            const handleLogin = (code) => {
                setClassId(code);
                setIsLoggedIn(true);
                setIsAdminMode(false);
                fetchInitialData(code);
            };

            const handleAdminLogin = async (pass) => {
                const res = await callGasApi('adminVerify', {}, pass);
                if (res && res.success) {
                    setAdminKey(pass);
                    setIsAdminMode(true);
                    setIsLoggedIn(false);
                    showNotification("成功進入管理者後台");
                    return true;
                } else {
                    showNotification(res?.message || "管理者密碼錯誤", true);
                    return false;
                }
            };

            const handleAddPoints = async (pointsToAdd) => {
                if (!selectedStudentId) {
                    showNotification("請先選擇學生！", true);
                    return;
                }
                const student = students.find(s => s.id === selectedStudentId);
                if (!student) return;
                
                const reasonText = selectedReason ? selectedReason.label : "一般加分";
                const finalPoints = Number(pointsToAdd);

                setStudents(prev => prev.map(s => s.id === student.id ? { ...s, points: (s.points || 0) + finalPoints } : s));
                setTotalClassPoints(prev => prev + finalPoints);
                setLogs(prev => [{ id: 't-' + Date.now(), studentName: student.name, points: finalPoints, reason: reasonText, timestamp: new Date().toISOString() }, ...prev].slice(0, 20));

                await callGasApi('updatePoints', {
                    studentId: student.id,
                    studentName: student.name,
                    points: finalPoints,
                    reason: reasonText
                });
            };

            const handleSaveStudent = async () => {
                if (isBatchMode) {
                    const names = batchStudentInput.split('\n').map(n => n.trim()).filter(n => n !== "");
                    if (names.length === 0) return;
                    
                    const newStudentsData = names.map((rawName, idx) => {
                        let name = rawName;
                        let seatNumber = `${idx + 1 + students.length}`;
                        const match = name.match(/^(\d+)[\s.-]+(.*)$/);
                        if (match) { seatNumber = match[1]; name = match[2]; }
                        return { name, seatNumber };
                    });
                    
                    setIsStudentModalOpen(false);
                    const res = await callGasApi('batchAddStudents', { students: newStudentsData });
                    if (res && res.success) {
                        showNotification(`已批次新增 ${newStudentsData.length} 名學生`);
                        fetchInitialData(classId);
                    }
                } else {
                    if (!studentFormName.trim()) return;
                    setIsStudentModalOpen(false);
                    const res = await callGasApi('addStudent', { name: studentFormName, seatNumber: `${students.length + 1}` });
                    if (res && res.success) {
                        showNotification(`新增學生成功：${studentFormName}`);
                        fetchInitialData(classId);
                    }
                }
            };

            const handleDeleteStudent = async (id, name) => {
                if (window.confirm(`確定刪除 ${name} 嗎？`)) {
                    const res = await callGasApi('deleteStudent', { id });
                    if (res && res.success) {
                        showNotification(`已刪除 ${name}`);
                        fetchInitialData(classId);
                    }
                }
            };

            return (
                <div>
                    {/* 全局通知欄 */}
                    {notification && (
                        <div className={`fixed top-4 right-4 px-6 py-3 rounded-lg shadow-lg text-white font-medium z-50 ${notification.isError ? 'bg-red-500' : 'bg-green-500'}`}>
                            {notification.msg}
                        </div>
                    )}

                    {isAdminMode ? (
                        <AdminDashboard 
                            adminKey={adminKey} 
                            onExit={() => setIsAdminMode(false)}
                            onSelectClass={(selectedCId) => {
                                setIsAdminMode(false);
                                handleLogin(selectedCId);
                            }}
                            callGasApi={callGasApi}
                            showNotification={showNotification}
                        />
                    ) : !isLoggedIn ? (
                        <LoginScreen onLogin={handleLogin} onAdminLogin={handleAdminLogin} />
                    ) : (
                        <div className="max-w-6xl mx-auto p-4 font-sans text-gray-800">
                            <div className="flex flex-col sm:flex-row justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-6">
                                <div className="flex items-center gap-3 mb-4 sm:mb-0">
                                    <span className="text-3xl">🌱</span>
                                    <div>
                                        <h1 className="text-2xl font-bold text-gray-800">班級點數 ({classId})</h1>
                                        <p className="text-sm text-gray-500">一起努力，創造更棒的班級！</p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4">
                                    <div className="bg-blue-50 px-4 py-2 rounded-lg border border-blue-100 flex items-center gap-2">
                                        <span className="text-xl">🏆</span>
                                        <div>
                                            <div className="text-xs text-blue-600 font-semibold">班級總點數</div>
                                            <div className="text-xl font-bold text-blue-700">{totalClassPoints}</div>
                                        </div>
                                    </div>
                                    <button onClick={() => setIsLoggedIn(false)} className="px-3 py-2 text-sm text-gray-600 hover:bg-gray-100 rounded-lg">
                                        切換班級 🚪
                                    </button>
                                </div>
                            </div>

                            <div className="flex gap-2 mb-6 bg-white p-1 rounded-lg w-fit shadow-sm">
                                <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-md font-medium ${activeTab === 'dashboard' ? 'bg-blue-100 text-blue-700' : 'text-gray-500'}`}>主控台</button>
                                <button onClick={() => setActiveTab('students')} className={`px-4 py-2 rounded-md font-medium ${activeTab === 'students' ? 'bg-blue-100 text-blue-700' : 'text-gray-500'}`}>學生管理</button>
                            </div>

                            {activeTab === 'dashboard' && (
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    <div className="lg:col-span-2 space-y-6">
                                        <div className="bg-teal-50 border border-teal-100 rounded-2xl p-6 shadow-sm">
                                            <h2 className="text-lg font-bold text-teal-800 mb-4">⚡ 快速加分</h2>
                                            <div className="space-y-4">
                                                <div>
                                                    <label className="block text-sm font-medium text-teal-700 mb-2">1. 選擇學生：</label>
                                                    <select 
                                                        className="w-full p-3 rounded-lg border border-teal-200 outline-none bg-white text-lg"
                                                        value={selectedStudentId}
                                                        onChange={(e) => setSelectedStudentId(e.target.value)}
                                                    >
                                                        <option value="">-- 請選擇學生 --</option>
                                                        {students.map(s => (
                                                            <option key={s.id} value={s.id}>{s.seatNumber ? `${s.seatNumber}號 - ` : ''}{s.name} (目前 {s.points || 0} 點)</option>
                                                        ))}
                                                    </select>
                                                </div>

                                                <div>
                                                    <label className="block text-sm font-medium text-teal-700 mb-2">2. 選擇事由：</label>
                                                    <div className="flex flex-wrap gap-2">
                                                        {DEFAULT_REASONS.map(reason => (
                                                            <button
                                                                key={reason.id}
                                                                onClick={() => setSelectedReason(reason === selectedReason ? null : reason)}
                                                                className={`px-3 py-1.5 rounded-full text-sm font-medium border ${selectedReason?.id === reason.id ? 'bg-teal-600 text-white' : 'bg-white text-teal-700 border-teal-200'}`}
                                                            >
                                                                {reason.label} (+{reason.points})
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="block text-sm font-medium text-teal-700 mb-2">3. 給予點數：</label>
                                                    <div className="grid grid-cols-3 gap-3">
                                                        {[1, 2, 5].map(pts => (
                                                            <button key={pts} onClick={() => handleAddPoints(pts)} className="bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 rounded-xl text-xl shadow-sm">+{pts}</button>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                                            <h2 className="text-lg font-bold text-gray-800 mb-4">學生點數一覽</h2>
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                                {students.map(s => (
                                                    <div key={s.id} onClick={() => setSelectedStudentId(s.id)} className={`p-4 rounded-xl border cursor-pointer ${selectedStudentId === s.id ? 'border-blue-500 bg-blue-50 ring-2 ring-blue-200' : 'border-gray-200'}`}>
                                                        <div className="text-xs text-gray-400">{s.seatNumber}號</div>
                                                        <div className="font-bold text-gray-800 truncate">{s.name}</div>
                                                        <div className="mt-2 text-xl font-black text-blue-600">{s.points || 0}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>

                                    <div>
                                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 h-full max-h-[700px] flex flex-col">
                                            <h2 className="text-lg font-bold text-gray-800 mb-4">🕒 最近紀錄</h2>
                                            <div className="flex-1 overflow-y-auto space-y-3">
                                                {logs.map(log => (
                                                    <div key={log.id} className="p-3 bg-gray-50 rounded-lg text-sm flex justify-between items-start">
                                                        <div>
                                                            <div className="font-bold text-gray-700">{log.studentName}</div>
                                                            <div className="text-gray-500 text-xs">{log.reason}</div>
                                                        </div>
                                                        <div className={`font-bold ${log.points > 0 ? 'text-green-600' : 'text-red-500'}`}>
                                                            +{log.points}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'students' && (
                                <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-xl font-bold text-gray-800">學生名單</h2>
                                        <button onClick={() => setIsStudentModalOpen(true)} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium">➕ 新增學生</button>
                                    </div>
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-gray-50 text-gray-500 border-b">
                                                <th className="p-4 font-medium">座號</th>
                                                <th className="p-4 font-medium">姓名</th>
                                                <th className="p-4 font-medium">點數</th>
                                                <th className="p-4 font-medium text-right">操作</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {students.map((s, idx) => (
                                                <tr key={s.id} className="border-b hover:bg-gray-50">
                                                    <td className="p-4 text-gray-600">{s.seatNumber || idx + 1}</td>
                                                    <td className="p-4 font-medium">{s.name}</td>
                                                    <td className="p-4 font-bold text-blue-600">{s.points || 0}</td>
                                                    <td className="p-4 text-right">
                                                        <button onClick={() => handleDeleteStudent(s.id, s.name)} className="text-red-500 hover:underline">刪除</button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )}

                            {isStudentModalOpen && (
                                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
                                    <div className="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl">
                                        <h3 className="text-lg font-bold mb-4">新增學生</h3>
                                        <div className="flex gap-2 mb-4 bg-gray-100 p-1 rounded-lg">
                                            <button onClick={() => setIsBatchMode(false)} className={`flex-1 py-1.5 text-sm font-medium rounded-md ${!isBatchMode ? 'bg-white shadow' : 'text-gray-500'}`}>單筆新增</button>
                                            <button onClick={() => setIsBatchMode(true)} className={`flex-1 py-1.5 text-sm font-medium rounded-md ${isBatchMode ? 'bg-white shadow' : 'text-gray-500'}`}>批次新增</button>
                                        </div>
                                        {!isBatchMode ? (
                                            <input type="text" className="w-full p-2.5 border rounded-lg mb-4 outline-none" placeholder="學生姓名" value={studentFormName} onChange={(e) => setStudentFormName(e.target.value)} />
                                        ) : (
                                            <textarea className="w-full p-2.5 border rounded-lg mb-4 h-32 outline-none text-sm" placeholder="每行一位學生，例如：&#10;1 葉大雄&#10;2 宜靜" value={batchStudentInput} onChange={(e) => setBatchStudentInput(e.target.value)} />
                                        )}
                                        <div className="flex justify-end gap-2">
                                            <button onClick={() => setIsStudentModalOpen(false)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg">取消</button>
                                            <button onClick={handleSaveStudent} className="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium">儲存</button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ClassPointSystem />);
    </script>
</body>
</html>
